name: "Setup MSVC"
description: "Setup MSVC toolchain (ilammy/msvc-dev-cmd) and fix Git Bash shadowing of link.exe. Windows only; no-op on other runners."

inputs:
  arch:
    description: "MSVC architecture (e.g. x64, x86)"
    required: false
    default: "x64"

runs:
  using: "composite"
  steps:
    - name: "Setup MSVC (msvc-dev-cmd)"
      if: "${{ runner.os == 'Windows' }}"
      uses: "ilammy/msvc-dev-cmd@v1"
      with:
        arch: "${{ inputs.arch }}"

    # Git for Windows ships C:\Program Files\Git\usr\bin\link.exe (MSYS)
    # which shadows MSVC's link.exe on PATH and breaks cl.exe linking.
    # Remove that entry. Must run after msvc-dev-cmd.
    - name: "Remove Git usr/bin from PATH (Windows)"
      if: "${{ runner.os == 'Windows' }}"
      shell: "bash"
      run: |
        # Git for Windows ships C:\Program Files\Git\usr\bin\link.exe (MSYS)
        # which shadows MSVC's link.exe on PATH and breaks cl.exe linking.
        # bash on Windows sees PATH as colon-separated (/c/...:/usr/bin...),
        # while GITHUB_ENV expects semicolon-separated. Detect delimiter.
        if printf '%s' "$PATH" | grep -q ';'; then delim=';'; else delim=':'; fi
        filtered="$(printf '%s' "$PATH" | tr "$delim" '\n' | { grep -iv 'Git.*usr.bin' || true; } | paste -sd "$delim" -)"
        # Fallback: if filtering somehow emptied PATH, keep original
        if [ -z "$filtered" ]; then filtered="$PATH"; fi
        echo "PATH=$filtered" >> "$GITHUB_ENV"
        printf "Filtered Git usr/bin from PATH (entries: %s -> %s, delim='%s')\n" "$(printf '%s' "$PATH" | tr "$delim" '\n' | wc -l)" "$(printf '%s' "$filtered" | tr "$delim" '\n' | wc -l)" "$delim"
