[package]
name    = "tinylang-v2-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tinylang      = { package = "tinylang-v2", path = ".." }

[[bin]]
name  = "frame"
path  = "fuzz_targets/frame.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "artifact"
path  = "fuzz_targets/artifact.rs"
test  = false
doc   = false
bench = false

[workspace]
members = [ "." ]
