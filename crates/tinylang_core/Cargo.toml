[package]
name                   = "tinylang-v2"
version                = "2.1.0"
edition.workspace      = true
description            = "TinyLang compiler, verified bytecode runtime, adaptive JIT, and C ABI"
license-file.workspace = true
repository.workspace   = true
readme                 = "README.md"
keywords               = [ "language", "compiler", "bytecode", "vm", "jit" ]
categories             = [ "compilers" ]
exclude                = [ "/main.rs", "/bindings", "/experiments", "/fuzz", "/requirements-llvm.txt" ]

[features]
default = [  ]
testing-hooks = [ "ralloc/testing-hooks" ]
cranelift = [
  "dep:memmap2",
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-jit",
  "dep:cranelift-module",
  "dep:cranelift-native",
]

[lib]
name       = "tinylang"
crate-type = [ "rlib", "cdylib" ]

[[bin]]
name = "tinylang"
path = "src/main.rs"

[[bin]]
name = "tinylang-v2"
path = "src/bin/tinylang-v2.rs"

## TODO(@mrdwarf7): [refactor] Move this to a separate crate for benchmarking and testing.
[[bin]]
name = "tinylang_bench"
path = "src/bin/tinylang_bench.rs"

## TODO(@mrdwarf7): [refactor] Move this to a separate crate for benchmarking and testing.
[[bin]]
name = "tinylang-sandbox-worker"
path = "src/bin/tinylang-sandbox-worker.rs"

## TODO(@mrdwarf7): [refactor] Move this to a separate crate for benchmarking and testing.
[[test]]
name              = "language_suite"
path              = "tests/language_suite.rs"
harness           = false
required-features = [ "testing-hooks" ]

[dependencies]
thiserror          = "2"
blake2             = "0.10"
hex                = "0.4"
serde              = { version = "1", features = [ "derive" ] }
serde_json         = "1"
toml               = "0.8"
ed25519-dalek      = { version = "2", default-features = false, features = [ "std" ] }
sha2               = "0.10"
ralloc             = { version = "0.2.0", package = "tinylang_ralloc", path = "../tinylang_ralloc" }
cranelift-codegen  = { version = "0.125", optional = true }
cranelift-frontend = { version = "0.125", optional = true }
cranelift-jit      = { version = "0.125", optional = true }
cranelift-module   = { version = "0.125", optional = true }
cranelift-native   = { version = "0.125", optional = true }

[target.'cfg(not(windows))'.dependencies]
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
tempfile              = "3"
tinylang_test_support = { version = "0.1.0", path = "../tinylang_test_support" }
